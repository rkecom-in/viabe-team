# Gitleaks config (created 2026-07-27, promotion #541 unblock).
#
# The ONLY allowlist is the Clau business-knowledge research corpus: SAVED THIRD-PARTY
# PUBLIC WEBPAGES (salesforce.com methodology pages, Reddit threads, PIB releases, Google
# Business Profile docs). Their embedded front-end build tokens / public GCP browser keys
# trip generic-api-key + gcp-api-key (54 findings, all third-party HTML) — none are Viabe

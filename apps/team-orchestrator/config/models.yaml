# Model configuration.
#
# VT-732 (2026-08-05) — this file is now ONLY the non-Claude model pins.
#
# Every Claude/LLM slot that used to live here (sales_recovery, self_evaluate,
# owner_input_classifier, vision_extraction, owner_typed_extraction,
# cash_book_merge, zomato_theme_extraction, method_selector, business_plan) has
# been RETIRED onto the ``TEAM_MODEL_*`` env tiers resolved by
# ``orchestrator.llm.provider``. Reason: two governance surfaces meant a
# deployment could set the model in one place while the call kept picking from
# the other — on dev, all five TEAM_MODEL_* vars read gpt-5.6-luna while this
# file quietly kept sales_recovery on claude-sonnet-5, which is where the
# Sonnet burn came from. A per-environment env var IS the production/test split
# these slots encoded, so the split is not lost, only unified.
#
# Tier map for the retired keys (each is a named constant at its call site):
#   sales_recovery / vision_extraction / cash_book_merge / business_plan -> specialist
#   self_evaluate                                                        -> review
#   owner_input_classifier / owner_typed_extraction /
#   zomato_theme_extraction / method_selector                            -> classifier
#   agent_drafting (sales_recovery_executor)                             -> routine
#
# DO NOT re-add an LLM slot here. Point the env var instead — the CI gate
# ``scripts/gate_no_model_literals.py`` fails the build on a new one.

# VT-59 voice_transcription — Sarvam Indic ASR for cash-book voice notes. NOT a
# Claude model: this is Sarvam's STT model id (India residency, DPDP-favorable,
# CL-422). saarika:v2.5 is the current/valid model (saarika:v2 was deprecated →
# HTTP 400, caught by the VT-278 live canary). Resolver:
# voice_transcription._resolve_model. Key = SARVAM_API_KEY (.viabe/secrets/sarvam.env).
voice_transcription:
  production: saarika:v2.5
  test: saarika:v2.5
